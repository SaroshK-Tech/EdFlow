{% extends "base.html" %}

{% block content %}
{% include "partials/page_header.html" with title=page_title subtitle=page_subtitle %}

<form method="post" enctype="multipart/form-data" novalidate>
    {% csrf_token %}
    <div class="card">
        <div class="card-header">Student details</div>
        <div class="card-body">
            <div class="row g-3">
                {% for field in form %}
                    <div class="col-md-6">
                        {% include "partials/field.html" with field=field %}
                    </div>
                {% endfor %}
            </div>
        </div>
        <div class="card-footer d-flex justify-content-between bg-transparent">
            <a href="{% if object %}{% url 'students:detail' object.pk %}{% else %}{% url 'students:list' %}{% endif %}" class="btn btn-outline-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>Save</button>
        </div>
    </div>
</form>
{% endblock %}
