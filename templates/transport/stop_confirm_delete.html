{% extends "base.html" %}

{% block content %}
<div class="page-header">
    <div>
        <h1 class="page-title">{{ heading|default:"Delete Stop" }}</h1>
        <p class="page-subtitle mb-0">{{ object }}</p>
    </div>
</div>

<div class="card">
    <div class="card-body">
        <p class="mb-3">Delete stop <strong>{{ object.name }}</strong> on route <strong>{{ object.route.name }}</strong>? This cannot be undone.</p>
        <form method="post" class="d-flex justify-content-between">
            {% csrf_token %}
            <a href="{% url 'transport:stops' %}" class="btn btn-outline-secondary">Cancel</a>
            <button type="submit" class="btn btn-danger"><i class="bi bi-trash me-1"></i>Delete</button>
        </form>
    </div>
</div>
{% endblock %}
