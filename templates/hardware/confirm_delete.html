{% extends "base.html" %}

{% block content %}
<div class="card mx-auto mt-4" style="max-width:520px;">
    <div class="card-body text-center py-5">
        <span class="stat-icon bg-danger-soft mb-3" style="width:56px;height:56px;font-size:1.5rem;"><i class="bi bi-exclamation-triangle"></i></span>
        <h4 class="fw-semibold">Delete device?</h4>
        <p class="text-muted">You are about to delete <strong>{{ object.name }}</strong> ({{ object.get_device_type_display }}).</p>
        <p class="text-muted small mb-4">Its gateway token will be revoked. This cannot be undone.</p>
        <form method="post">
            {% csrf_token %}
            <div class="d-flex justify-content-center gap-2">
                <a href="{% url 'hardware:devices' %}" class="btn btn-outline-secondary">Cancel</a>
                <button type="submit" class="btn btn-danger"><i class="bi bi-trash me-1"></i>Delete</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
