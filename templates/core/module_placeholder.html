{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="card text-center py-5" style="max-width: 640px; margin: 4rem auto;">
    <div class="card-body">
        <span class="stat-icon bg-primary-soft mb-3" style="width:64px;height:64px;font-size:1.8rem;">
            <i class="bi bi-tools"></i>
        </span>
        <h4 class="fw-semibold">{{ module_label }} module</h4>
        <p class="text-muted mb-1">
            This module is planned for EdFlow but is not implemented yet.
            It will be built on top of the modular Django apps scaffolded in <code>apps/</code>.
        </p>
        <p class="text-muted mb-4"><code>module: {{ module }}</code></p>
        <a href="{% url 'core:dashboard' %}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i>Back to dashboard</a>
    </div>
</div>
{% endblock %}
