{% extends "base.html" %}

{% block content %}
<div class="auth-card">
    <div class="card">
        <div class="card-body p-4 text-center">
            <i class="bi bi-check-circle text-success" style="font-size:2.5rem;"></i>
            <h4 class="fw-semibold mt-2 mb-1">All done</h4>
            <p class="text-muted small mb-0">Your password has been reset. You can now sign in with the new one.</p>
        </div>
        <div class="card-footer bg-transparent text-center py-3 small">
            <a href="{% url 'accounts:login' %}" class="text-decoration-none">Sign in →</a>
        </div>
    </div>
</div>
{% endblock %}
