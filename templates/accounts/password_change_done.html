{% extends "base.html" %}

{% block title %}Password changed · {{ school.name|default:"EdFlow" }}{% endblock %}

{% block content %}
<div class="auth-shell">
    <div class="card auth-card shadow-sm text-center">
        <div class="card-body p-4 p-md-5">
            <span class="stat-icon bg-success-soft mb-3" style="width:60px;height:60px;font-size:1.6rem;">
                <i class="bi bi-check-circle"></i>
            </span>
            <h4 class="fw-semibold">Password changed</h4>
            <p class="text-muted">Your password has been updated successfully.</p>
            <a class="btn btn-primary" href="{% url 'core:dashboard' %}">Back to dashboard</a>
        </div>
    </div>
</div>
{% endblock %}
