{% extends "base.html" %}

{% block content %}
<div class="auth-card">
    <div class="card">
        <div class="card-body p-4">
            <h4 class="fw-semibold mb-1">Choose a new password</h4>
            <p class="text-muted small mb-4">Enter a strong password for your account.</p>
            <form method="post" novalidate>
                {% csrf_token %}
                {% include "partials/field.html" with field=form.new_password1 %}
                {% include "partials/field.html" with field=form.new_password2 %}
                <div class="d-grid mt-3">
                    <button type="submit" class="btn btn-primary"><i class="bi bi-shield-lock me-1"></i>Save new password</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
