{% extends "base.html" %}

{% block content %}
<div class="auth-card">
    <div class="card">
        <div class="card-body p-4 text-center">
            <i class="bi bi-envelope-check text-success" style="font-size:2.5rem;"></i>
            <h4 class="fw-semibold mt-2 mb-1">Check your inbox</h4>
            <p class="text-muted small mb-0">If an account exists for that address, a password reset link has been sent.</p>
        </div>
        <div class="card-footer bg-transparent text-center py-3 small">
            <a href="{% url 'accounts:login' %}" class="text-decoration-none">Back to login</a>
        </div>
    </div>
</div>
{% endblock %}
