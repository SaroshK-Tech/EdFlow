{% extends "base.html" %}

{% block content %}
<div class="auth-card">
    <div class="card">
        <div class="card-body p-4">
            <h4 class="fw-semibold mb-1">Reset password</h4>
            <p class="text-muted small mb-4">Enter the email address linked to your account and we'll send reset instructions.</p>
            <form method="post" novalidate>
                {% csrf_token %}
                {% include "partials/field.html" with field=form.email %}
                <div class="d-grid mt-3">
                    <button type="submit" class="btn btn-primary"><i class="bi bi-envelope me-1"></i>Send reset link</button>
                </div>
            </form>
        </div>
        <div class="card-footer bg-transparent text-center py-3 small">
            <a href="{% url 'accounts:login' %}" class="text-decoration-none">Back to login</a>
        </div>
    </div>
</div>
{% endblock %}
