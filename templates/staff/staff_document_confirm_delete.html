{% extends "base.html" %}

{% block content %}
{% include "partials/page_header.html" with title=page_title %}

<div class="card">
    <div class="card-body text-center py-5">
        <i class="bi bi-exclamation-triangle text-warning" style="font-size:3rem"></i>
        <h5 class="mt-3">Delete this document?</h5>
        <p class="text-muted"><strong>{{ object.title }}</strong> for {{ member.full_name }}.</p>
        <form method="post">
            {% csrf_token %}
            <a href="{% url 'staff:detail' member.pk %}" class="btn btn-outline-secondary">Cancel</a>
            <button type="submit" class="btn btn-danger"><i class="bi bi-trash me-1"></i>Delete</button>
        </form>
    </div>
</div>
{% endblock %}
