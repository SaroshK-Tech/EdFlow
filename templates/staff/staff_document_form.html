{% extends "base.html" %}

{% block content %}
{% include "partials/page_header.html" with title=page_title subtitle="Upload staff document" %}

<form method="post" enctype="multipart/form-data" novalidate>
    {% csrf_token %}
    <div class="card">
        <div class="card-body">
            <div class="row g-3">
                {% for field in form %}
                    <div class="col-md-6">
                        {% include "partials/field.html" with field=field %}
                    </div>
                {% endfor %}
            </div>
        </div>
        <div class="card-footer d-flex justify-content-between bg-transparent">
            <a href="{% url 'staff:detail' member.pk %}" class="btn btn-outline-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary"><i class="bi bi-upload me-1"></i>Upload</button>
        </div>
    </div>
</form>
{% endblock %}
