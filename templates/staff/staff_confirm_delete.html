{% extends "base.html" %}

{% block content %}
{% include "partials/page_header.html" with title=page_title %}

<div class="card">
    <div class="card-body text-center py-5">
        <i class="bi bi-exclamation-triangle text-warning" style="font-size:3rem"></i>
        <h5 class="mt-3">Remove staff member?</h5>
        <p class="text-muted">{{ member.employee_code }} — {{ member.full_name }}. This cannot be undone.</p>
        <form method="post">
            {% csrf_token %}
            <a href="{% url 'staff:detail' member.pk %}" class="btn btn-outline-secondary">Cancel</a>
            <button type="submit" class="btn btn-danger"><i class="bi bi-trash me-1"></i>Remove</button>
        </form>
    </div>
</div>
{% endblock %}
