{% extends "base.html" %}

{% block content %}
<div class="card mx-auto mt-4" style="max-width: 520px;">
    <div class="card-body text-center p-4 p-md-5">
        <span class="stat-icon bg-danger-soft mb-3" style="width:60px;height:60px;font-size:1.6rem;"><i class="bi bi-exclamation-triangle"></i></span>
        <h4 class="fw-semibold">Delete {{ guardian.full_name }}?</h4>
        <p class="text-muted">This removes the parent/guardian profile. Existing students are not affected.</p>
        <form method="post">
            {% csrf_token %}
            <div class="d-flex justify-content-center gap-2">
                <a href="{% url 'parents:list' %}" class="btn btn-outline-secondary">Cancel</a>
                <button type="submit" class="btn btn-danger"><i class="bi bi-trash me-1"></i>Delete</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
