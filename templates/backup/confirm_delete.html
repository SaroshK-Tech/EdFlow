{% extends "base.html" %}

{% block content %}
{% include "partials/page_header.html" with title=page_title subtitle=page_subtitle %}

<div class="card">
    <div class="card-body">
        <div class="alert alert-warning d-flex gap-2 align-items-start">
            <i class="bi bi-exclamation-triangle mt-1"></i>
            <div>
                Remove <strong>{{ object.name }}</strong>? Existing archives on disk are <em>not</em> deleted —
                only the destination profile is removed from the system.
            </div>
        </div>
        <form method="post">
            {% csrf_token %}
            <button class="btn btn-danger" type="submit"><i class="bi bi-trash me-1"></i>Remove destination</button>
            <a href="{% url 'backup:list' %}" class="btn btn-link text-muted">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
