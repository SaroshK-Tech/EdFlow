<div class="card mt-3">
    <div class="card-header"><span class="fw-semibold"><i class="bi bi-pencil-square me-1"></i>Edit cell — {{ selected }}</span></div>
    <div class="card-body">
        <form method="post" action="{% url 'timetable:cell' timetable.pk %}" class="row g-2 align-items-end">
            {% csrf_token %}
            <input type="hidden" name="klass" value="{{ selected.pk }}">
            <div class="col-md-2">
                <label class="form-label small text-muted">Day</label>
                <select name="weekday" class="form-select form-select-sm">
                    {% for value, label in weekday_choices %}
                        <option value="{{ value }}">{{ label }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-2">
                <label class="form-label small text-muted">Period</label>
                <select name="period" class="form-select form-select-sm">
                    {% for p in all_periods %}
                        <option value="{{ p.pk }}">P{{ p.order }} ({{ p.start_time|time:"H:i" }})</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label small text-muted">Subject</label>
                <select name="subject" class="form-select form-select-sm">
                    {% for s in all_subjects %}
                        <option value="{{ s.pk }}">{{ s.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label small text-muted">Teacher</label>
                <select name="teacher" class="form-select form-select-sm">
                    {% for t in all_teachers %}
                        <option value="{{ t.pk }}">{{ t.full_name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-2">
                <label class="form-label small text-muted">Room</label>
                <select name="room" class="form-select form-select-sm">
                    {% for r in all_rooms %}
                        <option value="{{ r.pk }}">{{ r.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-12">
                <button class="btn btn-sm btn-primary"><i class="bi bi-check-lg me-1"></i>Apply to cell</button>
                <span class="small text-muted ms-2">Locked cells are preserved on regeneration.</span>
            </div>
        </form>
    </div>
</div>
