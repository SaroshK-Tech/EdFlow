{% extends "base.html" %}

{% block content %}
<div class="card mx-auto mt-4" style="max-width:520px;">
    <div class="card-body text-center py-5">
        <span class="stat-icon bg-warning-soft mb-3" style="width:56px;height:56px;font-size:1.5rem;"><i class="bi bi-slash-circle"></i></span>
        <h4 class="fw-semibold">Cancel message?</h4>
        <p class="text-muted">Recipient <strong>{{ outbox.recipient }}</strong> — status <strong class="text-capitalize">{{ outbox.status }}</strong></p>
        <div class="alert alert-secondary small text-start">{{ outbox.message }}</div>
        <form method="post">
            {% csrf_token %}
            <div class="d-flex justify-content-center gap-2">
                <a href="{% url 'communication:message_detail' outbox.pk %}" class="btn btn-outline-secondary">Keep</a>
                <button type="submit" class="btn btn-danger"><i class="bi bi-slash-circle me-1"></i>Cancel message</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
