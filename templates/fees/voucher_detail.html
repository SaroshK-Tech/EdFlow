{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="page-header no-print">
    <div>
        <h1 class="page-title">{{ voucher.voucher_number }}</h1>
        <p class="page-subtitle mb-0">{{ voucher.student.full_name }} · {{ voucher.get_status_display }}</p>
    </div>
    <div class="d-flex gap-2">
        <a class="btn btn-outline-secondary" href="{% url 'fees:vouchers' %}"><i class="bi bi-arrow-left me-1"></i>Back</a>
        <button class="btn btn-primary" onclick="window.print()"><i class="bi bi-printer me-1"></i>Print</button>
        <a class="btn btn-outline-danger" href="{% url 'fees:voucher_delete' voucher.pk %}"><i class="bi bi-trash me-1"></i>Delete</a>
    </div>
</div>

<div class="voucher-print-wrap">
    {% include "fees/_voucher_body.html" %}
</div>
{% endblock %}

{% block extra_css %}
<style>
@media print {
    .app-sidebar, .app-sidebar-backdrop, .app-topbar, .app-footer,
    .no-print, .toast-container { display: none !important; }
    .app-content { padding: 0 !important; }
    .app-main { margin: 0 !important; }
    body, .app-wrapper { background: #fff !important; }
    .voucher-print-wrap { box-shadow: none !important; }
    @page { size: A4; margin: 12mm; }
}
</style>
{% endblock %}
